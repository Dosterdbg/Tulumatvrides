<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATV Tours in Tulum | Tulum ATV Rides</title>

  <!-- Fuentes exactas de Kangaroo Island Trails -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============================================================
     HEADER (idéntico a Kangaroo Island Trails)
============================================================ -->
<header class="site-header" id="site-header">
  <div class="header-inner">

    <!-- Logo a la izquierda -->
    <a href="#" class="logo">
      <img src="images/logo.png" alt="Tulum ATV Rides" />
    </a>

    <!-- Menú de navegación centrado -->
    <nav class="main-nav" id="main-nav">
      <ul>
        <li><a href="#experiences">Experiences</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#plan">Plan Your Trip</a></li>
      </ul>
    </nav>

    <!-- Botones a la derecha -->
    <div class="header-actions">
      <a href="#contact" class="btn-header-outline">Contact Us</a>
      <a href="https://wa.me/529842531713" target="_blank" class="btn-header-solid">Book Now</a>
    </div>

    <!-- Hamburguesa (mobile) -->
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

  </div>
</header>

<!-- ============================================================
     HERO / BANNER GIGANTE CON VIDEO DE FONDO
============================================================ -->
<section class="hero" id="home">

  <!-- Video de fondo (ocupa toda la pantalla) -->
  <div class="hero-video-wrapper">
    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      poster="images/hero-poster.jpg">
      <source src="images/hero-video.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Overlay oscuro para legibilidad del texto -->
  <div class="hero-overlay"></div>

  <!-- Contenido centrado -->
  <div class="hero-content">
    <h1>Explore the Best ATV Tours in Tulum</h1>
    <p class="hero-subtitle">Unplug. Explore. Reconnect.</p>
    <a href="#tours" class="btn-hero">Book Your Journey Today</a>
  </div>

</section>

<script src="js/main.js"></script>
</body>
</html>
